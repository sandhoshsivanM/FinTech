name: Backend

# The .NET microservices under backend/. Runs only when they, or the contract
# fixtures they share with the apps, change — so a Flutter-only PR doesn't wait
# for Docker to pull Postgres and RabbitMQ.
on:
  push:
    branches: ['**']
    paths: ['backend/**', 'contracts/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'contracts/**', '.github/workflows/backend.yml']

jobs:
  build-test:
    name: Build and test (.NET)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore Khazana.slnx
      # Warnings are errors (Directory.Build.props): a new warning fails here.
      - name: Build
        run: dotnet build Khazana.slnx --no-restore --configuration Release
      # Unit, architecture and gateway tests, plus integration tests against
      # real Postgres and RabbitMQ containers (Testcontainers uses the runner's
      # Docker).
      - name: Test
        run: dotnet test --solution Khazana.slnx --no-build --configuration Release

  # Specs under contracts/openapi/ are generated from the real endpoints; any
  # difference from what is committed fails the build.
  openapi-drift:
    name: OpenAPI drift check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Regenerate specs and diff
        run: backend/tools/check-openapi.sh
