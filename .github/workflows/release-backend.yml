name: Release backend (online)

# Publishes the online platform's container images.
#   git tag online-v1.2.3 && git push origin online-v1.2.3
# builds every service and the gateway as a container (no Dockerfile: the .NET
# SDK builds the image) and pushes it to GitHub Container Registry tagged
# 1.2.3 and latest. Run manually to build without pushing.
#
# This publishes images only. Deploying them is a separate, deliberate step.
on:
  push:
    tags: ['online-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify (build + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet test --solution backend/Khazana.slnx --configuration Release
      - name: OpenAPI specs are current
        run: backend/tools/check-openapi.sh

  images:
    name: Image ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, project: backend/Khazana.Gateway/Khazana.Gateway.csproj }
          - { name: identity, project: backend/services/Identity/Khazana.Identity.Api/Khazana.Identity.Api.csproj }
          - { name: devices, project: backend/services/Devices/Khazana.Devices.Api/Khazana.Devices.Api.csproj }
          - { name: sync, project: backend/services/Sync/Khazana.Sync.Api/Khazana.Sync.Api.csproj }
          - { name: notification, project: backend/services/Notification/Khazana.Notification.Api/Khazana.Notification.Api.csproj }
          - { name: catalog, project: backend/services/Catalog/Khazana.Catalog.Api/Khazana.Catalog.Api.csproj }
          - { name: marketdata, project: backend/services/MarketData/Khazana.MarketData.Api/Khazana.MarketData.Api.csproj }
          - { name: auditreporting, project: backend/services/AuditReporting/Khazana.AuditReporting.Api/Khazana.AuditReporting.Api.csproj }
          - { name: admin, project: backend/services/Admin/Khazana.Admin/Khazana.Admin.csproj }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/online-v* ]]; then
            echo "version=${GITHUB_REF_NAME#online-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/online-v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # On a tag: pushed to ghcr.io. Otherwise: built into the runner's local
      # Docker daemon only, which proves the image builds without publishing it.
      - name: Publish container
        run: |
          set -euo pipefail
          repo=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')/khazana-${{ matrix.name }}
          args=(--configuration Release --os linux --arch x64 /t:PublishContainer
                -p:ContainerRepository="$repo" -p:Version="${{ steps.v.outputs.version }}")
          if [[ "$GITHUB_REF" == refs/tags/online-v* ]]; then
            args+=(-p:ContainerRegistry=ghcr.io "-p:ContainerImageTags=\"${{ steps.v.outputs.version }};latest\"")
          else
            args+=("-p:ContainerImageTags=${{ steps.v.outputs.version }}")
          fi
          dotnet publish "${{ matrix.project }}" "${args[@]}"
