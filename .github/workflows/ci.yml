name: CI

# Lint + tests + build on both stacks (Next.js web app and the Flutter app)
# for every push and pull request.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Cheap and first: five files each state the product's version, and the
  # release workflow reads one of them to name the GitHub release while the
  # backup header stamps another into every file a user exports. They drifted
  # once (1.0.0 / 0.1.0 / 0.1.0 / 1.0.0) and nothing noticed.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tool/check_versions.sh

  webapp:
    name: Web app (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      # Alpha rules pull in opposite directions (iOS must be opaque; Tauri,
      # Next's favicon.ico decoder and everything else must be RGBA), and the
      # hand-built icon.icns must match the generated PNGs. Both broke once.
      - name: Icon pipeline check
        run: node ../tool/check_icons.mjs
      # Hard gates: the suite must pass and the static export must build.
      - name: Unit + component tests
        run: npm run test
      - name: Static export build
        run: npm run build
      # Advisory: the repo carries pre-existing react-hooks/purity lint debt
      # under Next 16's ruleset (tracked separately). Surfaced, not gated, so
      # new lint regressions are visible without blocking unrelated work.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

  # Pixel-compares the key screens (light/dark x desktop/mobile) against the
  # Linux baselines committed in webapp/e2e/__screenshots__/. Pinned to an
  # exact Ubuntu image rather than ubuntu-latest: system fonts and the
  # rasteriser come from the image, and a silent image bump would shift every
  # baseline at once.
  # Khazana Online for the web: a separate app from webapp/ (ADR 0007), with
  # its own lockfile, tests and build.
  webapp-online:
    name: Online web app (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp-online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp-online/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Static export build
        run: npm run build

  visual:
    name: Visual regression
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - name: Static export build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # `missing` writes a baseline for any screenshot that has none (and fails
      # that test); existing baselines are compared, never overwritten.
      - name: Visual tests
        id: visual
        continue-on-error: true
        run: npx playwright test --update-snapshots=missing
      - name: Collect new baselines
        id: baselines
        if: always()
        run: |
          new=$(git ls-files --others --exclude-standard -- e2e/__screenshots__)
          if [ -n "$new" ]; then
            mkdir -p "$RUNNER_TEMP/visual-baselines"
            echo "$new" | while read -r f; do
              mkdir -p "$RUNNER_TEMP/visual-baselines/webapp/$(dirname "$f")"
              cp "$f" "$RUNNER_TEMP/visual-baselines/webapp/$f"
            done
            echo "count=$(echo "$new" | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload new baselines
        if: always() && steps.baselines.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          # Holds webapp/e2e/__screenshots__/...: unzip at the repo root.
          path: ${{ runner.temp }}/visual-baselines/
          retention-days: 14
      - name: Upload report
        if: always() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            webapp/e2e/.report/
            webapp/e2e/.results/
          retention-days: 14
      - name: Verdict
        if: always()
        env:
          NEW: ${{ steps.baselines.outputs.count }}
          OUTCOME: ${{ steps.visual.outcome }}
        run: |
          if [ "$NEW" != "0" ]; then
            echo "::error title=Visual baselines missing::$NEW screenshot baseline(s) had no Linux reference and were generated by this run. Download the 'visual-baselines' artifact from this run, unzip it at the repository root (it contains webapp/e2e/__screenshots__/...), review the images, and commit them."
            exit 1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "::error title=Visual regression::Screenshots differ from the committed baselines. Download the 'visual-report' artifact and open e2e/.report/index.html for expected/actual/diff. If the change is intended, regenerate the baselines: delete the affected webapp/e2e/__screenshots__/**/*-linux.png files and push; this job will then hand back new ones as the 'visual-baselines' artifact."
            exit 1
          fi
          echo "All screenshots match the committed baselines."

  # Khazana Online for phones: a separate Flutter app from the offline one at
  # the repo root (ADR 0007), with its own analysis and tests.
  mobile-online:
    name: Online mobile app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-online
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      # The integration test needs a device and the local backend; it runs by hand.
      - name: Tests
        run: flutter test

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Shared domain package (ADR 0007): resolve it so the analyzer can read
      # its own analysis_options, then analyze it on its own too.
      - name: Shared domain package
        working-directory: packages/khazana_domain
        run: dart pub get && dart analyze --fatal-infos
      # Drift / json codegen must run before analyze & test.
      - name: Codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze
      # Goldens are pixel-compares tied to the host's font rendering; they pass
      # only on the machine that generated them, so they're excluded from CI.
      - name: Unit + integration tests
        run: flutter test --exclude-tags golden
