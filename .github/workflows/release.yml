name: Release

# Builds the desktop installers for every platform.
#
# This exists because Tauri cannot cross-compile: it links against each
# platform's native webview and toolchain, so a Windows .exe has to be produced
# on Windows and a .dmg on macOS. Building them by hand on three machines is how
# a release ends up with three different versions of the app in it, so the whole
# set is built from one commit here instead.
#
# Two ways to run it:
#   · Push a tag — `git tag v1.0.0 && git push origin v1.0.0` — which builds
#     every target and opens a draft GitHub release with the installers attached.
#   · Actions → Release → "Run workflow", to get the installers as downloadable
#     build artifacts without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The tag build writes a release; nothing else needs write access.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away installers that did build.
      fail-fast: false
      matrix:
        include:
          # NSIS gives the .exe installer; WiX gives the .msi. Both are produced
          # by the default target set, and organisations that deploy by policy
          # generally want the .msi.
          - os: windows-latest
            label: Windows (x64 .exe + .msi)
            target: x86_64-pc-windows-msvc
            args: ''

          # Apple silicon and Intel are built separately rather than as a
          # universal binary: two 7 MB downloads beat one 14 MB one, and the
          # DMG layout config applies cleanly to each.
          - os: macos-latest
            label: macOS (Apple silicon .dmg)
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            label: macOS (Intel .dmg)
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

          - os: ubuntu-22.04
            label: Linux (.AppImage + .deb)
            target: x86_64-unknown-linux-gnu
            args: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Keyed on the target so the macOS runner does not thrash between its two
      # architectures.
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: webapp/src-tauri
          key: ${{ matrix.target }}

      # Tauri on Linux links against WebKitGTK and libsoup; the runner image
      # carries neither. 22.04 is pinned deliberately — the AppImage produced on
      # 24.04 requires a glibc newer than most current distributions ship.
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      # The same gate as CI. An installer that ships a failing ledger is worse
      # than no installer, and this is the last point at which that is cheap to
      # catch.
      - name: Tests
        working-directory: webapp
        run: npm run test

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: webapp
          args: ${{ matrix.args }}
          # Only a tag build publishes. A manual run just leaves the artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Khazana __VERSION__' || '' }}
          releaseBody: |
            Khazana __VERSION__ — private, offline-first personal finance.

            **These installers are not code-signed.** Windows SmartScreen will
            warn on first run (More info → Run anyway) and macOS Gatekeeper will
            refuse the app until it is opened via right-click → Open, or the
            quarantine flag is cleared. Signing certificates are what remove
            those prompts; see the release checklist in the repo.
          releaseDraft: true
          prerelease: false

      # Manual runs get the installers here, since nothing is published.
      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: khazana-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            webapp/src-tauri/target/release/bundle/nsis/*.exe
            webapp/src-tauri/target/release/bundle/msi/*.msi
            webapp/src-tauri/target/release/bundle/dmg/*.dmg
            webapp/src-tauri/target/release/bundle/appimage/*.AppImage
            webapp/src-tauri/target/release/bundle/deb/*.deb
            webapp/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            webapp/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            webapp/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
